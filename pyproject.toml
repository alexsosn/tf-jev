[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-jev"
version = "0.1.0.dev0"
description = "Compile natural-language requests into native Text-Fabric search queries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Oleksandr (Alex) Sosnovshchenko" },
]
dependencies = [
  "text-fabric>=13.1,<14",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/alexsosn/tf-jev"
Issues = "https://github.com/alexsosn/tf-jev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# text-fabric ships no type information
module = ["tf", "tf.*"]
ignore_missing_imports = true
