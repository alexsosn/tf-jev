name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,jev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Installed wheel smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tf-jev-wheel-venv"
          vpy="$RUNNER_TEMP/tf-jev-wheel-venv/bin/python"
          "$vpy" -m pip install "$RUNNER_TEMP"/wheels/tf_jev-*.whl
          cd "$RUNNER_TEMP"
          "$vpy" -c "import importlib.util, tf_jev, tf_jev.compiler, tf_jev.schema, tf_jev.retrieval; assert tf_jev.__version__ == '0.1.0.dev0'; assert importlib.util.find_spec('typesafe_sdk') is None"
