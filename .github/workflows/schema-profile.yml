name: BHSA schema extraction profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/schema-profile.yml"
      - "scripts/profile_schema.py"
      - "tests/test_schema_profile.py"
      - "src/tf_jev/schema.py"
      - "src/tf_jev/parser.py"
      - "tests/test_schema_selected.py"
      - "docs/research/issue-20-schema-profiling.md"
      - "docs/design/issue-20-profile-baseline.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-profile.yml"
      - "scripts/profile_schema.py"
      - "tests/test_schema_profile.py"
      - "src/tf_jev/schema.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bhsa-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BHSA_COMMIT: 4db00e2157915495e1a4d3d57e41223df24775da

    steps:
      - name: Checkout profiling code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and native Text-Fabric
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install 'text-fabric==13.1.0'
          python -c "from importlib.metadata import version; assert version('text-fabric') == '13.1.0'"

      - name: Fetch public corpus at exact immutable commit
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/bhsa"
          git init "$directory"
          git -C "$directory" remote add origin https://github.com/ETCBC/bhsa.git
          git -C "$directory" sparse-checkout init --cone
          git -C "$directory" sparse-checkout set tf/2021
          git -C "$directory" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$BHSA_COMMIT"
          git -C "$directory" checkout --detach FETCH_HEAD
          test "$(git -C "$directory" rev-parse HEAD)" = "$BHSA_COMMIT"
          git -C "$directory" diff --quiet
          test -f "$directory/tf/2021/otype.tf"

      - name: Profile cold load and complete schema extraction
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.profile_schema "$RUNNER_TEMP/bhsa/tf/2021" \
            --output "$RUNNER_TEMP/schema-profile.json"
          python - "$RUNNER_TEMP/schema-profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          assert info["tf_version"] == "13.1.0"
          assert info["version_dir"] == "2021"
          assert info["dataset"] == "BHSA"
          assert info["coverage"]["mode"] == "full"
          assert info["loaded_sha256"] == "70150b50dab4ba75908146225ec450652256e2471d131f6106cd3bdaac19e82d"
          assert info["node_features"] >= 100
          assert info["edge_features"] >= 1
          assert info["object_types"] >= 2
          assert info["load_seconds"] >= 0
          assert info["extract_seconds"] > 0
          expected = (
            "discover", "load_features", "type_index", "warp_digest",
            "node_features", "edge_features", "source_identity", "domains",
          )
          assert tuple(phase["name"] for phase in info["phases"]) == expected
          assert abs(sum(p["seconds"] for p in info["phases"]) - info["extract_seconds"]) < 2
          assert all(p["seconds"] >= 0 for p in info["phases"])
          assert info["peak_process_rss_bytes"] is not None
          assert not info["trace_python"]
          print(json.dumps(info, sort_keys=True))
          PY

      - name: Profile selected three-feature coverage on the same pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.profile_schema "$RUNNER_TEMP/bhsa/tf/2021" \
            --node-features sp gn nu --edge-features \
            --output "$RUNNER_TEMP/schema-selected-profile.json"
          python - "$RUNNER_TEMP/schema-profile.json" "$RUNNER_TEMP/schema-selected-profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          full, selected = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          assert full["coverage"]["mode"] == "full"
          assert selected["coverage"]["mode"] == "selected"
          assert selected["coverage"]["node_features"] == ["gn", "nu", "sp"]
          assert selected["coverage"]["edge_features"] == []
          assert "lex" in selected["coverage"]["omitted_node_features"]
          assert "mother" in selected["coverage"]["omitted_edge_features"]
          assert selected["node_features"] == 3
          assert selected["edge_features"] == 0
          assert selected["object_types"] == full["object_types"]
          assert selected["loaded_sha256"] != full["loaded_sha256"]
          assert selected["extract_seconds"] > 0
          assert len(selected["phases"]) == len(full["phases"]) == 8
          print("PROFILE COMPARISON (seconds / whole-process RSS):")
          for key in ("load_seconds", "extract_seconds", "peak_process_rss_bytes",
                      "rss_bytes_after_extract"):
              print(f"{key}: full={full[key]}, selected={selected[key]}")
          print(json.dumps(selected, sort_keys=True))
          PY

      - name: Verify selected native BHSA query result tuples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from tf.fabric import Fabric
          from tf_jev.schema import extract_schema, SchemaError
          from tf_jev.compiler import compile_query
          from tf_jev.ir import Atom, Predicate, PredicateOp, Query
          corpus = Path(os.environ["RUNNER_TEMP"]) / "bhsa" / "tf" / "2021"
          api = Fabric(locations=str(corpus), silent="deep").load("", silent="deep")
          schema = extract_schema(api, node_features=("gn", "nu", "sp"), edge_features=())
          query = compile_query(Query((Atom("word", (
              Predicate("sp", PredicateOp.EQ, ("verb",)),
          )),)), schema)
          actual = tuple(api.S.search(query, shallow=False, silent="deep"))
          reference = tuple(api.S.search("word sp=verb", shallow=False, silent="deep"))
          assert actual == reference and len(actual) == 73710
          try:
              schema.domain("lex", "word")
          except SchemaError as exc:
              assert "omitted" in str(exc)
          else:
              raise AssertionError("partial schema silently accepted unloaded feature")
          print(f"selected native TF result tuples: {len(actual)}; exact equal")
          PY

      - name: Archive aggregate resource metrics, no corpus data
        uses: actions/upload-artifact@v4
        with:
          name: bhsa-2021-schema-extraction-profile
          path: |
            ${{ runner.temp }}/schema-profile.json
            ${{ runner.temp }}/schema-selected-profile.json
          if-no-files-found: error
          retention-days: 30
